const ICONS={"lock": "<rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\" /><path d=\"M7 11V7a5 5 0 0 1 10 0v4\" />", "play": "<path d=\"M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z\" />", "headphones": "<path d=\"M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3\" />", "search": "<path d=\"m21 21-4.34-4.34\" /><circle cx=\"11\" cy=\"11\" r=\"8\" />", "repeat": "<path d=\"m17 2 4 4-4 4\" /><path d=\"M3 11v-1a4 4 0 0 1 4-4h14\" /><path d=\"m7 22-4-4 4-4\" /><path d=\"M21 13v1a4 4 0 0 1-4 4H3\" />", "log-in": "<path d=\"m10 17 5-5-5-5\" /><path d=\"M15 12H3\" /><path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4\" />", "log-out": "<path d=\"m16 17 5-5-5-5\" /><path d=\"M21 12H9\" /><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\" />", "circle-dot": "<circle cx=\"12\" cy=\"12\" r=\"1\" /><circle cx=\"12\" cy=\"12\" r=\"10\" />", "settings": "<path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\" /><circle cx=\"12\" cy=\"12\" r=\"3\" />", "panel-left": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /><path d=\"M9 3v18\" />", "panel-right": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /><path d=\"M15 3v18\" />", "layout-panel-top": "<rect width=\"18\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\" /><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\" /><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\" />", "timer": "<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\" /><line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\" /><circle cx=\"12\" cy=\"14\" r=\"8\" />", "list-music": "<path d=\"M16 5H3\" /><path d=\"M11 12H3\" /><path d=\"M11 19H3\" /><path d=\"M21 16V5\" /><circle cx=\"18\" cy=\"16\" r=\"3\" />", "sliders-vertical": "<path d=\"M10 8h4\" /><path d=\"M12 21v-9\" /><path d=\"M12 8V3\" /><path d=\"M17 16h4\" /><path d=\"M19 12V3\" /><path d=\"M19 21v-5\" /><path d=\"M3 14h4\" /><path d=\"M5 10V3\" /><path d=\"M5 21v-7\" />", "audio-lines": "<path d=\"M2 10v3\" /><path d=\"M6 6v11\" /><path d=\"M10 3v18\" /><path d=\"M14 8v7\" /><path d=\"M18 5v13\" /><path d=\"M22 10v3\" />"};const icon=(n,t)=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

function wave(d){let p='',g='';const seam=d==='A'?100:0,sign=d==='A'?-1:1;for(let i=0;i<170;i++){const h=Math.min(98,9+Math.abs(Math.sin(i*.25)*Math.cos(i*.09))*70+(i%17===0?18:0));p+=`<line x1="${i*6}" x2="${i*6}" y1="${seam}" y2="${seam+sign*h}" stroke="${d==='A'?'#ffb376':'#76d7e9'}" stroke-opacity=".75" stroke-width="3"/><line x1="${i*6}" x2="${i*6}" y1="${seam}" y2="${seam+sign*h*.45}" stroke="${d==='A'?'#ffe2b7':'#d9f9ff'}" stroke-width="2"/>`};for(let x=0;x<1020;x+=85)g+=`<line x1="${x}" x2="${x}" y1="0" y2="100" stroke="#a7bdd8" opacity=".24"/>`;return `<div class="wave ${d==='B'?'b':''}"><b class="letter">${d}</b><svg viewBox="0 0 1020 100" preserveAspectRatio="none" aria-label="Synthetic deck ${d} waveform">${g}${p}</svg><span class="needle"></span></div>`}
function mini(d){let s='';for(let i=0;i<120;i++){const h=1+Math.abs(Math.sin(i*.3+(d==='B'?2:0))*Math.cos(i*.07))*9;s+=`<line x1="${i*6}" x2="${i*6}" y1="${10-h}" y2="${10+h}" stroke="${d==='A'?'#efb18b':'#8cdeed'}" stroke-width="3"/>`}return `<svg viewBox="0 0 720 20" preserveAspectRatio="none">${s}</svg>`}
const overview=()=>`<div class="overview-wrap"><div class="overrow"><span class="overid">A</span><div class="overline" style="left:16.129%;width:72.043%">${mini('A')}</div><i class="overneedle"></i></div><div class="overrow"><span class="overid">B</span><div class="overline b" style="left:0;width:100%">${mini('B')}</div><i class="overneedle"></i></div></div>`;
const bar=()=>`<div class="bar"><span class="brand">OXI<i>DJ</i></span><span class="search">${icon("search")} Search your collection</span><span class="barbtns" aria-label="Panels"><span title="Navigation">${icon("panel-left")}</span><span title="Details">${icon("panel-right")}</span><span title="Decks">${icon("layout-panel-top")}</span><span title="Settings">${icon("settings")}</span></span></div>`;
const deck=(d)=>`<div class="deck ${d==='B'?'cool':''}"><div class="art-bg"></div><div class="glass"></div><div class="deck-content">${cover(d)}<div class="deck-body"><div class="track-title"><div class="deck-label">DECK ${d} · ${d==='A'?'WARM':'COOL'}</div><div class="title">${d==='A'?'Aurora Drift':'Blue Meridian'}</div><div class="artist">${d==='A'?'Studio Example':'Example Artist'} · Electronic</div></div><div class="actions"><div class="transport"><div class="loops"><span class="chip" title="Loop in" aria-label="Loop in">${icon("log-in")}</span><span class="chip" title="Loop out" aria-label="Loop out">${icon("log-out")}</span><span class="chip" title="Loop" aria-label="Loop">${icon("repeat")}</span></div><span class="circle" title="Cue" aria-label="Cue">${icon("circle-dot")}</span><span class="circle play" title="Play" aria-label="Play">${icon("play")}</span></div><div class="performance"><div class="hotlabel">HOT CUES</div><div class="pads">${[1,2,3,4,5,6,7,8].map(n=>`<span class="pad">${n}</span>`).join('')}</div></div></div></div><div class="pitch"><div class="tempo-info"><div class="bpm">${d==='A'?'124.0':'126.0'}</div><div class="sync-row"><span class="sync">SYNC</span><span class="chip" title="Key lock" aria-label="Key lock">${icon("lock")}</span></div><span class="status">KEY ${d==='A'?'8A':'9A'}</span><span class="status remain">${icon("timer")}−${d==='A'?'1:28':'2:12'}</span><span class="range">±6%</span></div><div class="slidercol"><div class="slider" aria-label="Pitch fader"></div></div></div></div></div>`;
const mixer=()=>`<div class="mix"><div class="mixchannels">${['A','B'].map((d,i)=>`<div class="mixstrip"><div class="ctrls"><span class="mixid">${d}</span><span class="mixinput">LINE ▾</span><span class="kn"><span class="mixlabel">TRIM</span><i class="knob trim"></i></span>${['HIGH','MID','LOW'].map((x,k)=>`<span class="kn eq${k===0?' eq-first':''}${k===2?' eq-last':''}"><span class="mixlabel">${x}</span><i class="knob"></i></span>`).join('')}<span class="kn"><span class="mixlabel">FILTER</span><i class="knob filter"></i></span><span class="hp" title="Headphone cue" aria-label="Headphone cue">${icon("headphones")}</span></div><i class="vol"></i></div>${i===0?'<div class="meterpair"><i class="meter"></i><i class="meter"></i></div>':''}`).join('')}</div><div class="xf"><span class="xf-label">CROSSFADER</span><div class="xf-row"><span>A</span><div class="cross"></div><span>B</span></div></div></div>`;
const library=()=>`<div class="library"><div class="nav"><b>COLLECTION</b><div>All tracks</div><div>Recently added</div><div>Playlists</div><div>♫ Night drives</div><div>♫ New music</div></div><div class="table-wrap"><table class="table"><thead><tr><th>ART</th><th>TITLE</th><th>ARTIST</th><th>BPM</th><th>KEY</th><th>ALBUM</th><th>GENRE</th><th>···</th></tr></thead><tbody>${['Aurora Drift','Blue Meridian','Still Motion','Lunar Glass','Glasshouse','Evening Light','Signal Path','Quiet Motion'].map((n,i)=>`<tr><td><span class="thumb">${i%2?'B':'A'}</span></td><td>${n}</td><td>Example Artist</td><td>${124+i}</td><td>${5+i}A</td><td>Imaginary Signals</td><td>Electronic</td><td>⋯</td></tr>`).join('')}</tbody></table></div><div class="details"><b>TRACK DETAILS</b><div>Title · Aurora Drift</div><div>Artist · Studio Example</div><div>Album · Imaginary Signals</div><div>Genre · Electronic</div><div>Key · 8A</div><div>All metadata ▾</div></div></div>`;

const stack=()=>`<div class="wave-stack">${wave('A')}${wave('B')}</div>`;
const a=`${bar()}<div class="decks">${deck('A')}${mixer()}${deck('B')}</div><div class="wave-area">${stack()}</div>${overview()}${library()}`;
const b=`${bar()}<div class="wave-area">${stack()}</div>${overview()}<div class="decks">${deck('A')}${mixer()}${deck('B')}</div>${library()}`;
const c=`${bar()}<div class="wave-area">${stack()}</div>${overview()}<div class="decks">${deck('A')}${deck('B')}${mixer()}</div>${library()}`;
const dd=`${bar()}<div class="wave-area">${stack()}<div class="wave-mixer">${mixer()}</div></div>${overview()}<div class="decks">${deck('A')}${deck('B')}</div>${library()}`;
// All templates and content are fixed local synthetic mockup data; no external or user-provided HTML is interpolated.
const studies=[['b','Layout B · recommended','Waves and overviews on top; decks with the mixer between them below',b],['a','Layout A · club familiar','Decks and centre mixer on top; waves and overviews below',a],['c','Layout C · focus dock','Waves on top; two decks with the mixer docked at the right',c],['d','Layout D · waveform-side mixer','Mixer beside the waveforms; both decks in a row below',dd]];
document.querySelector('#layouts').innerHTML=studies.map(([id,title,desc,markup])=>`<section class="study"><h2>${title}<span class="sub">${desc}</span></h2><div class="frame"><div class="app layout-${id}">${markup}</div></div></section>`).join('');
const $=id=>document.getElementById(id);$('p-theme').onchange=e=>document.body.dataset.theme=e.target.value;$('p-density').onchange=e=>document.body.dataset.density=e.target.value;
for(const [id,cls,inv] of [['p-meta','hide-meta',true],['p-cross','hide-cross',true],['p-id','show-deck-id',false],['p-input','show-input',false],['p-outer','outer-knobs',false],['p-mirror','mirror-b',false]])$(id).onchange=e=>document.body.classList.toggle(cls,inv?!e.target.checked:e.target.checked);
</script></body></html>
