[package]
name = "oxidj-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OxiDJ local catalog and library handlers."
publish = false

[dependencies]
oxidj-core = { workspace = true }
hound = { version = "=3.5.1", default-features = false }
claxon = { version = "=0.4.3", default-features = false }
nanomp3 = { version = "=0.2.0", default-features = false }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
sha2 = "0.10.9"

[lints]
workspace = true
