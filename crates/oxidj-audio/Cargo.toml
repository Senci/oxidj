[package]
name = "oxidj-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OxiDJ realtime deck engine: CPAL output, lock-free commands, in-RAM decks."
publish = false

# Layer 1 (ADR-004 D2 amendment). No internal dependencies; the admitted
# exactly pinned `cpal` (device I/O, ADR-008), `rtrb` (lock-free SPSC
# command ring) and `signalsmith-stretch` (key lock, ADR-008 D3) only. `cargo xtask layers` rejects anything else. Decoding
# stays in `oxidj-library`; this crate plays already-decoded PCM from RAM.
[dependencies]
cpal = { version = "=0.18.2", default-features = false }
rtrb = { version = "=0.4.1", default-features = false }
# Key lock (ADR-008 D3 addendum): MIT wrapper around the MIT Signalsmith
# Stretch C++ library; builds with `cc` (C++14) and `bindgen` (libclang).
signalsmith-stretch = { version = "=0.1.3", default-features = false }

# Optional hosts and scheduling, all forwarded to cpal (no new direct
# dependency; plan/AUDIO.md A6). Off by default: each needs system pieces.
[features]
# Windows: Steinberg ASIO SDK (downloaded by cpal's build, or CPAL_ASIO_DIR)
# and LLVM/Clang (LIBCLANG_PATH). Select with OXIDJ_AUDIO_HOST=ASIO.
asio = ["cpal/asio"]
# Linux/macOS/Windows: a JACK server (PipeWire's JACK layer counts) and the
# JACK client library at build time. Select with OXIDJ_AUDIO_HOST=JACK.
jack = ["cpal/jack"]
# Ask the OS for realtime scheduling of the audio thread (ALSA, WASAPI).
realtime = ["cpal/realtime"]
# The same through RealtimeKit on Linux desktops, where a normal user has no
# realtime limit of their own (`ulimit -r` is 0). Needs libdbus at build time.
realtime-dbus = ["cpal/realtime-dbus"]

[lints]
workspace = true
