name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: auto

# SECURITY: this workflow interpolates NO untrusted inputs (${{ github.event.* }},
# PR/issue bodies, commit messages, etc.) into any `run:` command — every step is
# a fixed string — so there is no command-injection surface.

# The compiler is pinned by rust-toolchain.toml (channel = "1.99.0", profile
# minimal, components rustfmt / clippy / rust-analyzer / rust-src). The GitHub
# runner's rustup installs that exact toolchain on the first `cargo` invocation,
# so there is no separate install step that could drift from the pin.

jobs:
  gate:
    name: cargo xtask ci-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache build + cargo registry
        uses: Swatinem/rust-cache@v2

      # `ci-full` includes a mandatory cargo-deny licence gate. Install the
      # verified tool version before invoking the repo-owned gate.
      - name: Install cargo-deny (mandatory licence gate)
        run: cargo install cargo-deny --locked --version 0.20.2

      # Tier 1 (per handoff, stable, fast): layers + fmt + clippy + check; no advisory scans.
      # Tier 2 (tests):            cargo test --workspace --all-features --locked
      # Tier 2 (licence gate):     cargo deny check licenses (ADR-009 MIT allowlist)
      #
      # CI calls the repo-owned full-gate command rather than duplicating shell steps.
      # `cargo xtask ci-full` runs Tier 1 plus native tests and the mandatory
      # licence check; `cargo xtask ci` is the Tier-1 handoff portion.
      - name: cargo xtask ci-full (Tier 1 + Tier 2)
        run: cargo xtask ci-full

      # ------------------------------------------------------------------
      # Optional Tier-2 advisories. Not the hard gate: they are advisory,
      # `continue-on-error`, and installed on demand. The mandatory licence
      # gate (`cargo xtask deny`) already ran inside `ci-full` above.
      # ------------------------------------------------------------------
      - name: Install Tier-2 advisory tools (cargo-audit/machete/typos)
        continue-on-error: true
        run: |
          curl -L --proto '=https' --tlsv1.2 https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar xz -C "$HOME/.cargo/bin"
          cargo binstall -y cargo-audit cargo-machete typos-cli

      - name: cargo audit (RustSec advisories)
        continue-on-error: true
        run: cargo audit

      - name: cargo machete (unused declared deps)
        continue-on-error: true
        run: cargo machete --json || true

      - name: typos (spell check)
        continue-on-error: true
        run: typos --format json || true

      # Tier-3 analyses are deferred: no scheduled workflow is currently
      # configured here. If adopted, run them in a separate pinned-nightly job.
      # See docs/handoff-checklist.md for the current handoff contract.
