# OxiDJ — Rust-first open-source DJ library and performance application.
#
# Root virtual workspace manifest. Product crates:
#
#   crates/oxidj-core         neutral domain model          (layer 0)
#   crates/oxidj-library      shared catalog handlers        (layer 1)
#   crates/oxidj-analysis     offline analysis (waveform)    (layer 1; core only)
#   crates/oxidj-audio        realtime deck engine (CPAL)    (layer 1; cpal+rtrb only)
#   crates/oxidj-rekordbox    isolated XML + DeviceSQL adapter (layer 2)
#   crates/oxidj-onelibrary   isolated OneLibrary preview contract (layer 2)
#   crates/oxidj-application  shared operation orchestration (layer 3)
#   crates/oxidj-cli          command-line presentation       (layer 4)
#
# Audio / analysis / vendor adapters / UI stay out until their behavior is
# implemented and accepted (ADR-004).
# The boundary that enforces this — and stays meaningful as crates are added — is
# the `cargo xtask layers` gate, which is demonstrated to FAIL on a planted
# forbidden edge (see docs/layers-policy.md).
#
# License: MIT (ADR-009) — enforced as a build gate by `cargo deny check licenses`
# via deny.toml. Quality gate: `cargo xtask ci` (Tier 1, every handoff).
# Tier breakdown and handoff checklist: docs/handoff-checklist.md.

[workspace]
resolver = "2"
members = [
    "crates/oxidj-core",
    "crates/oxidj-library",
    "crates/oxidj-analysis",
    "crates/oxidj-audio",
    "crates/oxidj-rekordbox",
    "crates/oxidj-onelibrary",
    "crates/oxidj-application",
    "crates/oxidj-cli",
    "xtask",
]
# A bare `cargo build` / `cargo test` at the root covers the product crates only.
# `xtask` (a build-time tool) is invoked explicitly via `cargo xtask`.
default-members = [
    "crates/oxidj-core",
    "crates/oxidj-library",
    "crates/oxidj-analysis",
    "crates/oxidj-audio",
    "crates/oxidj-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.99.0"
license = "MIT"
description = "OxiDJ: a modern, open-source DJ library and performance application."

# Internal workspace dependencies, centralised so member crates inherit the
# version/edition from [workspace.package] via `{ workspace = true }`.
[workspace.dependencies]
oxidj-core = { path = "crates/oxidj-core", version = "0.1.0" }
oxidj-library = { path = "crates/oxidj-library", version = "0.1.0" }
oxidj-analysis = { path = "crates/oxidj-analysis", version = "0.1.0" }
oxidj-audio = { path = "crates/oxidj-audio", version = "0.1.0" }
oxidj-rekordbox = { path = "crates/oxidj-rekordbox", version = "0.1.0" }
oxidj-onelibrary = { path = "crates/oxidj-onelibrary", version = "0.1.0" }
oxidj-application = { path = "crates/oxidj-application", version = "0.1.0" }
rekordbox-pdb = { git = "https://github.com/fragmede/rekordbox-pdb-rs", rev = "b9896c4e279f2ffd5a8eee1f05a7a0282fe44f35" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# --- In-repo lint policy (reproducible on a fresh clone; M0-10 §0.2 / §0.4) ---
# `cargo::` lints (emitted by Cargo itself) are nightly-only on the 1.99 stable
# toolchain and are deliberately excluded from the stable gate (M0-10 §0.1).
# `[build] warnings = "deny"` in .cargo/config.toml turns rustc + clippy warnings
# into hard errors so the gate fails loudly on any lint.
[workspace.lints.rust]
# `rust_2018_idioms` is a GROUP, so it must sit at a lower priority than the
# individual lints below or Clippy's lint_groups_priority fires.
rust_2018_idioms = { level = "deny", priority = -1 }
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
# Default-on clippy groups only (pedantic/nursery/cargo/restriction are opt-in).
# `all` is a GROUP, so it must sit at a lower priority than the individual
# lints below (todo / unimplemented) or lint_groups_priority fires.
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
