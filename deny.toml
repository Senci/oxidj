# cargo-deny license policy for OxiDJ (ADR-009 — MIT licence, Accepted).
#
# OxiDJ is MIT-licensed. An accidental copyleft dependency would silently
# re-license the distributed binary, so this is enforced as a *build gate*, not
# a convention. Only the licenses in `allow` are permitted; every other license —
# including all copyleft families (GPL-2.0 / GPL-3.0 / LGPL-2.1 / LGPL-3.0 /
# AGPL-1.0 / AGPL-3.0 / SSPL-1.0) — is denied because it is not allow-listed.
#
# Run:  cargo deny check licenses      (or:  cargo xtask deny)
# Docs: https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
]
