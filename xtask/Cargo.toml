[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OxiDJ repo-owned task runner (build-time tool; never a product dependency)."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# Build-time only. `serde_json` parses `cargo metadata --no-deps` output for the
# dependency-layer guard. It is never a runtime dependency of oxidj-core or
# oxidj-cli; the licence gate (cargo-deny) vets it along with the whole tree.
[dependencies]
serde_json = "1"

[dev-dependencies]
quick-xml = "=0.41.0"
sha2 = "=0.10.9"

[lints]
workspace = true
