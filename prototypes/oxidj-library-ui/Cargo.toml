[package]
name = "oxidj-library-ui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
eframe = { version = "=0.32.3", features = ["accesskit", "persistence"] }
oxidj-library = { path = "../../crates/oxidj-library" }
oxidj-application = { path = "../../crates/oxidj-application" }
oxidj-audio = { path = "../../crates/oxidj-audio" }
quick-xml = "=0.41.0"

[dev-dependencies]
oxidj-analysis = { path = "../../crates/oxidj-analysis" }
serde_json = "1"
sha2 = "=0.10.9"
oxidj-rekordbox = { path = "../../crates/oxidj-rekordbox" }
image = { version = "=0.25.8", default-features = false, features = ["jpeg"] }
