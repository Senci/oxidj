[package]
name = "oxidj-library-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[features]
jack = ["oxidj-audio/jack"]

[dependencies]
eframe = { version = "=0.37.0", features = ["accesskit", "persistence"] }
oxidj-library = { path = "../../crates/oxidj-library" }
oxidj-application = { path = "../../crates/oxidj-application" }
oxidj-audio = { path = "../../crates/oxidj-audio" }
quick-xml = "=0.42.0"
serde_json = "1"
tempfile = "=3.27.0"

[dev-dependencies]
oxidj-analysis = { path = "../../crates/oxidj-analysis" }
sha2 = "=0.11.1"
oxidj-rekordbox = { path = "../../crates/oxidj-rekordbox" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
