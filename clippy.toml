# Clippy configuration for OxiDJ.
#
# `msrv` tells Clippy which Rust version to target for lint selection, so it does
# not recommend constructs that would break the declared `rust-version` (1.99.0)
# in the workspace manifest. This is a lint-time hint, not an MSRV assertion —
# it only affects which lint suggestions fire, and only on stable toolchains.
#
# Note: `todo!()` / `unimplemented!()` are banned in production code via the
# `todo` / `unimplemented` lint levels in the workspace `[lints]` table, not via
# `disallowed-methods` (that lint governs method/function calls, not macros).
msrv = "1.99.0"
